<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>~*~ M3U 2 STRM CoNvErTeR 2000 ~*~</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #000;
            min-height: 100vh;
            font-family: 'VT323', monospace;
            overflow-x: hidden;
        }
        
        #glcanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .content {
            position: relative;
            z-index: 10;
            background: rgba(0, 0, 128, 0.85);
            border: 4px solid #00ff00;
            padding: 30px;
            box-shadow: 0 0 30px #00ff00, inset 0 0 30px #000080;
            max-width: 700px;
            width: 90%;
            margin: 20px auto;
        }
        
        h1 {
            color: #ff00ff;
            font-size: 42px;
            text-align: center;
            text-shadow: 4px 4px #000;
            margin-bottom: 10px;
            animation: rainbow 3s linear infinite;
        }
        
        @keyframes rainbow {
            0% { color: #ff0000; }
            25% { color: #ffff00; }
            50% { color: #00ff00; }
            75% { color: #00ffff; }
            100% { color: #ff0000; }
        }
        
        .marquee {
            background: #000080;
            color: #00ff00;
            padding: 8px;
            font-size: 18px;
            border: 2px solid #00ff00;
            margin-bottom: 20px;
            text-align: center;
            overflow: hidden;
            white-space: nowrap;
        }
        
        .marquee span {
            display: inline-block;
            animation: scroll 10s linear infinite;
        }
        
        @keyframes scroll {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        
        .counter {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: #000;
            border: 2px solid #00ff00;
            padding: 5px 10px;
            color: #00ff00;
            z-index: 100;
        }
        
        .webmaster {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: #00ffff;
            font-size: 14px;
            z-index: 100;
            text-align: right;
        }
        
        .webmaster a { color: #ff00ff; text-decoration: none; }
        
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 50;
            background: 
                repeating-linear-gradient(0deg, rgba(0,0,0,0.2) 0px, rgba(0,0,0,0.2) 1px, transparent 1px, transparent 3px),
                radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,0.6) 100%);
            animation: flicker 0.15s infinite;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.7);
        }
        
        @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.98; } }
        
        .file-area {
            margin: 20px 0;
            padding: 20px;
            border: 2px dashed #00ff00;
            text-align: center;
        }
        
        .file-area input[type="file"] { display: none; }
        
        .file-btn {
            display: inline-block;
            background: #000080;
            color: #00ff00;
            padding: 12px 30px;
            font-size: 22px;
            cursor: pointer;
            border: 2px solid #00ff00;
            font-family: 'VT323', monospace;
        }
        
        .file-btn:hover { background: #0000ff; animation: blink 0.3s infinite; }
        
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        .file-info { color: #00ffff; margin: 10px 0; font-size: 18px; }
        
        .action-btn {
            background: #ff0000;
            color: #ffff00;
            padding: 12px 40px;
            font-size: 24px;
            cursor: pointer;
            border: 3px solid #ffff00;
            font-family: 'VT323', monospace;
            margin: 10px auto;
            display: block;
        }
        
        .action-btn:hover { background: #ff00ff; }
        
        .result { 
            margin-top: 15px; 
            padding: 15px; 
            background: #000; 
            border: 2px solid #00ff00;
            color: #00ff00;
            font-size: 18px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .result div { padding: 3px 0; border-bottom: 1px solid #003300; }
        
        .error { color: #ff0000; }
        
        .info-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00ffff;
            padding: 10px;
            margin: 10px 0;
            color: #00ffff;
            font-size: 16px;
        }
        
        .uc-gif {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 100;
        }
        
        #video-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }
        
        #video-container video,
        #video-container iframe {
            min-width: 100%;
            min-height: 100%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        
        #video-container video {
            filter: contrast(1.1) saturate(0.9) brightness(0.8);
        }
        
        #video-container iframe {
            width: 200vw;
            height: 200vh;
            transform: translate(-50%, -50%) scale(1.4);
            filter: contrast(1.2) saturate(0.8);
        }
    </style>
</head>
<body>
    <img class="uc-gif" src="https://web.archive.org/web/20090830194708/http://geocities.com/Athens/Acropolis/1383/uc.gif" alt="UC">
    
    <div class="counter">Visitors: <span id="counter">03124</span></div>
    
    <div class="webmaster">
        Webmaster: <a href="mailto:coolguy1999@yahoo.com">CoolGuy1999</a><br>
        Best @ 800x600 | IE 5.0
    </div>
    
    <div class="crt-overlay"></div>
    <div id="video-container">
        <video id="localVideo" autoplay loop muted playsinline></video>
        <div id="player"></div>
    </div>
    <canvas id="glcanvas"></canvas>
    
    <div class="content">
        <div class="marquee">
            <span>*** M3U 2 STRM CONVERTER *** DOWNLOAD FILES DIRECTLY ***</span>
        </div>
        
        <h1>*** M3U 2 STRM ***</h1>
        
        <div class="info-box">
            Upload .m3u playlist - files will download automatically!
        </div>
        
        <div class="file-area">
            <label class="file-btn">
                >>> CHOOSE M3U FILE <<<
                <input type="file" id="m3uFile" accept=".m3u">
            </label>
            <div class="file-info" id="m3uFileInfo">No file selected</div>
        </div>
        
        <button class="action-btn" id="convertBtn">*** CoNvErT! ***</button>
        
        <div id="result"></div>
    </div>

    <script>
        // === CONFIG ===
        const USE_YOUTUBE = false;        // true = YouTube, false = local video
        const LOCAL_VIDEO_PATH = 'output.webm';  // path to local video file
        const YOUTUBE_VIDEO_ID = 'NKzIXhpbaw4';  // YouTube video ID
        // ==============
        
        let player;
        
        if (USE_YOUTUBE) {
            document.getElementById('player').style.display = 'block';
            document.getElementById('localVideo').style.display = 'none';
        } else {
            document.getElementById('player').style.display = 'none';
            document.getElementById('localVideo').style.display = 'block';
        }
        
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: YOUTUBE_VIDEO_ID,
                playerVars: {
                    autoplay: 1,
                    loop: 1,
                    playlist: YOUTUBE_VIDEO_ID,
                    controls: 0,
                    modestbranding: 1,
                    rel: 0
                },
                events: {
                    onReady: function() {
                        player.setVolume(30);
                    }
                }
            });
        }
        
        if (USE_YOUTUBE) {
            const tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            document.head.appendChild(tag);
        }
        
        document.getElementById('m3uFile').addEventListener('change', function() {
            const info = document.getElementById('m3uFileInfo');
            info.textContent = this.files.length > 0 ? 'Selected: ' + this.files[0].name : 'No file selected';
        });
        
        function cleanFilename(filename) {
            return filename.replace(/[<>:"/\\|?*]/g, '_').replace(/\s+/g, ' ').trim() || 'unnamed';
        }
        
        async function downloadFile(content, filename) {
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            await new Promise(r => setTimeout(r, 100));
        }
        
        async function convertM3U() {
            const fileInput = document.getElementById('m3uFile');
            const resultDiv = document.getElementById('result');
            
            if (!fileInput.files.length) {
                resultDiv.innerHTML = '<div class="error">Please select a .m3u file first!</div>';
                return;
            }
            
            resultDiv.innerHTML = '<div>Processing...</div>';
            
            try {
                const text = await fileInput.files[0].text();
                const lines = text.split('\n');
                const strmFiles = {};
                let trackTitle = null;
                const folderName = cleanFilename(fileInput.files[0].name.replace('.m3u', ''));
                
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    
                    if (line.startsWith('#EXTINF:')) {
                        const match = line.match(/#EXTINF:0,(.*)$/);
                        if (match) {
                            trackTitle = match[1].trim();
                            trackTitle = trackTitle.replace(/\.(mkv|mp4|avi|webm|m4v)$/i, '.strm');
                            trackTitle = cleanFilename(trackTitle);
                        } else {
                            trackTitle = `Unknown_Title_${i}.strm`;
                        }
                    } else if (trackTitle && line.startsWith('http')) {
                        strmFiles[trackTitle] = line;
                        trackTitle = null;
                    } else if (trackTitle && !line) {
                        trackTitle = null;
                    }
                }
                
                if (Object.keys(strmFiles).length === 0) {
                    resultDiv.innerHTML = '<div class="error">No valid entries found!</div>';
                    return;
                }
                
                resultDiv.innerHTML = '';
                
                const entries = Object.entries(strmFiles);
                for (let i = 0; i < entries.length; i++) {
                    const [name, url] = entries[i];
                    const fullName = folderName + '/' + name;
                    
                    await downloadFile(url, fullName);
                    
                    const div = document.createElement('div');
                    div.textContent = `${i + 1}/${entries.length}: ${name}`;
                    resultDiv.appendChild(div);
                }
                
                const total = document.createElement('div');
                total.style.marginTop = '10px';
                total.style.color = '#ffff00';
                total.textContent = `=== DONE! Downloaded ${entries.length} files ===`;
                resultDiv.appendChild(total);
                
            } catch (e) {
                resultDiv.innerHTML = `<div class="error">Error: ${e.message}</div>`;
            }
        }
        
        document.getElementById('convertBtn').addEventListener('click', convertM3U);
        
        function initVideo() {
            if (!USE_YOUTUBE) {
                const video = document.getElementById('localVideo');
                video.src = LOCAL_VIDEO_PATH;
            }
        }
        
        document.getElementById('counter').textContent = 
            (parseInt(document.getElementById('counter').textContent) + Math.floor(Math.random() * 5))
            .toString().padStart(5, '0');
        
        window.addEventListener('load', initVideo);
    </script>
</body>
</html>
